name: 發布版本

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: 驗證版本、變更紀錄與品質
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 取出原始碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 安裝 Linux 系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: 安裝 Rust stable toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: 驗證標籤、Cargo 版本與變更紀錄
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "adoctl") | .version'
          )"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            printf '標籤 %s 與 Cargo 版本 %s 不一致；預期標籤為 %s。\n' \
              "${GITHUB_REF_NAME}" \
              "${version}" \
              "${expected_tag}" >&2
            exit 1
          fi

          if ! grep --fixed-strings --quiet "## [${version}] - " CHANGELOG.md; then
            printf 'CHANGELOG.md 缺少版本 %s 與發布日期標題。\n' "${version}" >&2
            exit 1
          fi

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: 執行完整 CI 檢查
        run: cargo xtask ci

  package:
    name: 封裝 ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate.outputs.version }}
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: 取出原始碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 安裝 GNU Linux 系統相依套件
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: 安裝 musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            musl-tools

      - name: 安裝 Rust stable toolchain 與編譯 target
        shell: bash
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --no-self-update
          rustup default stable
          rustup target add "${TARGET}"

      - name: 建立 release binary
        shell: bash
        run: cargo xtask package --target "${TARGET}"

      - name: 驗證與封裝 Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-package release-assets
          cp "dist/adoctl-${TARGET}" release-package/adoctl
          cp README.md CHANGELOG.md release-package/
          chmod +x release-package/adoctl

          actual_version="$(release-package/adoctl --version)"
          expected_version="adoctl ${VERSION}"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            printf 'binary 版本不一致：預期 %s，實際為 %s。\n' \
              "${expected_version}" \
              "${actual_version}" >&2
            exit 1
          fi

          tar \
            -czf "release-assets/adoctl-${TAG_NAME}-${TARGET}.tar.gz" \
            -C release-package \
            adoctl \
            README.md \
            CHANGELOG.md

      - name: 驗證與封裝 Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-package, release-assets | Out-Null
          Copy-Item "dist/adoctl-$env:TARGET.exe" "release-package/adoctl.exe"
          Copy-Item README.md, CHANGELOG.md release-package/

          $actualVersion = & "release-package/adoctl.exe" --version
          $expectedVersion = "adoctl $env:VERSION"
          if ($actualVersion -ne $expectedVersion) {
            throw "binary 版本不一致：預期 $expectedVersion，實際為 $actualVersion。"
          }

          Compress-Archive `
            -Path "release-package/*" `
            -DestinationPath "release-assets/adoctl-$env:TAG_NAME-$env:TARGET.zip"

      - name: 保存封裝產物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoctl-${{ matrix.target }}
          path: release-assets/adoctl-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 建立 GitHub Release
    needs:
      - validate
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: 取出原始碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 下載全部封裝產物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: adoctl-*
          path: release-assets
          merge-multiple: true

      - name: 建立校驗檔與 release notes
        shell: bash
        run: |
          set -euo pipefail

          (
            cd release-assets
            sha256sum adoctl-* > SHA256SUMS
          )

          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}] - " '
            index($0, heading) == 1 {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found && /^\[[^]]+\]:/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            printf 'CHANGELOG.md 的版本 %s 沒有 release notes。\n' "${version}" >&2
            exit 1
          fi

          printf '準備發布下列檔案：\n'
          find release-assets -maxdepth 1 -type f -print | sort

      - name: 發布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease_flags+=(--prerelease)
          fi

          gh release create \
            "${GITHUB_REF_NAME}" \
            release-assets/* \
            --verify-tag \
            --title "adoctl ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${prerelease_flags[@]}"
