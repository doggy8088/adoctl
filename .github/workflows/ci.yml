name: 持續整合

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: 格式、Clippy 與測試
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出原始碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 安裝 Rust stable toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: 顯示工具版本
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: 執行完整 CI 檢查
        run: cargo xtask ci
