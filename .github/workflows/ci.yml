name: 持續整合

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: 格式、Clippy 與測試
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出原始碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 安裝 Linux 系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: 安裝 Rust stable toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: 安裝 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: 安裝 npm 與鎖定相依套件
        run: |
          npm install --global npm@12.0.2
          npm ci --ignore-scripts

      - name: 顯示工具版本
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
          node --version
          npm --version

      - name: 執行 Rust 完整 CI 檢查
        run: cargo xtask ci

      - name: 驗證 npm wrapper 與封裝清單
        run: |
          npm test
          npm pack --dry-run --ignore-scripts
